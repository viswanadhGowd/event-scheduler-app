<div class="signup-container">
  <div class="signup-card">
    <h1>Create Account</h1>
    
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="signup()" #signupForm="ngForm">
      <div class="form-group">
        <label for="username">Username *</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email (Optional)</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          [disabled]="isLoading"
        />
      </div>

      <div class="button-group">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isLoading || !username.trim()"
        >
          {{ isLoading ? 'Creating...' : 'Create Account' }}
        </button>
      </div>
    </form>

    <div class="login-prompt">
      <p>Already have an account? Use the form below to login.</p>
    </div>

    <hr />

    <div class="login-inline">
      <h2>Login</h2>
      <div *ngIf="loginError" class="error-message">{{ loginError }}</div>
      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input id="login-username" name="loginUsername" [(ngModel)]="loginUsername" placeholder="Your username" />
        </div>
        <div class="button-group">
          <button type="submit" class="btn btn-primary" [disabled]="loginLoading || !loginUsername.trim()">
            {{ loginLoading ? 'Logging in...' : 'Login' }}
          </button>
        </div>
      </form>
      <div class="signup-link">
        <a routerLink="/login">Or open dedicated login page</a>
      </div>
    </div>
  </div>
</div>
