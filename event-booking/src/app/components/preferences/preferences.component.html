<div class="preferences-container">
  <div class="card">
    <div class="card-header">
      <h2>Event Category Preferences</h2>
      <div class="user-info" *ngIf="currentUser">
        <span class="username">User: {{ currentUser.username }}</span>
        <button class="btn-logout" (click)="logout()">Logout</button>
      </div>
    </div>
    <div class="card-content">
      <p>Select which event categories you're interested in:</p>
      
      <div class="category-list">
        <div *ngFor="let cat of categories" class="category-item">
          <label>
            <input 
              type="checkbox" 
              [checked]="selected.has(cat.id)" 
              (change)="toggle(cat.id, $event)"
            />
            {{ cat.name }}
          </label>
        </div>
      </div>

      <div *ngIf="successMessage" class="success-message">
        ✓ {{ successMessage }}
      </div>

      <div class="button-group">
        <button 
          (click)="savePreferences()"
          [disabled]="isLoading"
          class="btn btn-primary"
        >
          Save Preferences
        </button>
        <button 
          (click)="goToCalendar()"
          [disabled]="isLoading"
          class="btn btn-secondary"
        >
          View Calendar
        </button>
      </div>
    </div>
  </div>
</div>
